name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  perf-budget:
    # draw calls / triangles / shadow triangles / load time per quality tier on the mountain showcase, headless, no GPU (docs/DECISIONS.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run perf:budget
