name: CI
# Runs on pull requests, which is what gates a merge. It does not re-run on the merge commit: a squash merge is the tree the PR already tested.
on:
  pull_request:
# a newer push to the same branch supersedes the older run (cancelled runs are not failures, so no failure mail)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  perf-budget:
    timeout-minutes: 15
    # draw calls / triangles / shadow triangles / load time per quality tier on the mountain showcase, headless, no GPU (docs/DECISIONS.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run perf:budget
